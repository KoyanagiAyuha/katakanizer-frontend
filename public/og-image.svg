<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e8ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- パターン装飾 -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="50" fill="url(#ogGrad)"/>
    <circle cx="1100" cy="530" r="80" fill="url(#ogGrad)"/>
    <circle cx="200" cy="500" r="30" fill="url(#ogGrad)"/>
    <circle cx="1000" cy="130" r="40" fill="url(#ogGrad)"/>
  </g>

  <!-- 中央のロゴ -->
  <g transform="translate(600, 250) scale(4)">
    <path d="M -12 -15 L -12 15 M -12 -3 L 9 -3 M 9 -3 L 9 9 M 9 9 C 9 9 11 13 15 15"
          stroke="url(#ogGrad)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <!-- ドット装飾 -->
    <circle cx="18" cy="0" r="2" fill="#ec4899"/>
    <circle cx="23" cy="0" r="2" fill="#a855f7"/>
    <circle cx="28" cy="0" r="2" fill="#8b5cf6"/>
  </g>

  <!-- タイトル -->
  <text x="600" y="380" font-family="'SF Pro Display', sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#1f2937">
    Katakanizer
  </text>

  <!-- サブタイトル -->
  <text x="600" y="440" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#6b7280">
    英語を自然なカタカナ音に変換
  </text>

  <!-- URL/ドメイン（オプション） -->
  <text x="600" y="560" font-family="'SF Pro Display', sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#9ca3af">
    katakanizer.com
  </text>
</svg>