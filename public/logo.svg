<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ロゴマーク：カタカナの「カ」をモダンにアレンジ -->
  <g transform="translate(15, 15)">
    <!-- 「カ」の本体 -->
    <path d="M 5 5 L 5 25 M 5 12 L 20 12 M 20 12 L 20 20 M 20 20 C 20 20 22 23 25 25"
          stroke="url(#primaryGradient)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- 変換を示すドット -->
    <circle cx="30" cy="15" r="2" fill="#ec4899"/>
    <circle cx="35" cy="15" r="2" fill="#a855f7"/>
    <circle cx="40" cy="15" r="2" fill="#8b5cf6"/>
  </g>

  <!-- ロゴテキスト -->
  <text x="70" y="38" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#1f2937">
    Katakanizer
  </text>
</svg>