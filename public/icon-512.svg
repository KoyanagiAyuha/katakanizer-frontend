<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow512">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad512)"/>

  <!-- 大きな「カ」 -->
  <g transform="translate(256, 256) scale(8)">
    <path d="M -12 -15 L -12 15 M -12 -3 L 9 -3 M 9 -3 L 9 9 M 9 9 C 9 9 11 13 15 15"
          stroke="url(#iconGrad512)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          filter="url(#shadow512)"/>
    <!-- ドット装飾 -->
    <circle cx="18" cy="0" r="2" fill="#ec4899" opacity="0.9"/>
    <circle cx="23" cy="0" r="2" fill="#a855f7" opacity="0.9"/>
    <circle cx="28" cy="0" r="2" fill="#8b5cf6" opacity="0.9"/>
  </g>

  <!-- 下部にアプリ名（オプション） -->
  <text x="256" y="440" font-family="'SF Pro Display', sans-serif" font-size="48" font-weight="600" text-anchor="middle" fill="#4b5563" opacity="0.8">
    Katakanizer
  </text>
</svg>